name: CI/CD Build and Publish

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest

  # Optional: add deploy step to remote server using SSH (secrets required)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: false # Enable and configure for your environment
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest
            docker-compose -f /opt/omics/docker-compose.yml pull
            docker-compose -f /opt/omics/docker-compose.yml up -d --remove-orphans
